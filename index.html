<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рисовалка</title>
    <style>
        body { margin: 0; background: #1c1c1c; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #controls { background: #2b2b2b; padding: 15px; display: flex; justify-content: space-around; align-items: center; }
        canvas { background: white; touch-action: none; }
        .info { color: white; font-size: 12px; text-align: center; background: #444; padding: 5px; }
        input[type="color"] { width: 40px; height: 40px; border-radius: 5px; border: none; }
        button { padding: 10px; border-radius: 5px; border: none; background: #d32f2f; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="info">Нарисуй, сделай скриншот и отправь его боту в чат!</div>
    <div id="controls">
        <input type="color" id="color" value="#000000">
        <select id="width">
            <option value="3">Тонко</option>
            <option value="8" selected>Средне</option>
            <option value="15">Жирно</option>
        </select>
        <button onclick="clearCanvas()">ОЧИСТИТЬ</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const color = document.getElementById('color');
        const width = document.getElementById('width');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 100;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        window.onresize = resize;
        resize();

        let drawing = false;
        const getPos = (e) => ({
            x: e.touches ? e.touches[0].clientX : e.clientX,
            y: (e.touches ? e.touches[0].clientY : e.clientY) - canvas.offsetTop
        });

        const start = (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { 
            if(!drawing) return; 
            const p = getPos(e); 
            ctx.strokeStyle = color.value; 
            ctx.lineWidth = width.value; 
            ctx.lineTo(p.x, p.y); 
            ctx.stroke(); 
        };
        const stop = () => drawing = false;

        canvas.onmousedown = start; canvas.onmousemove = move; window.onmouseup = stop;
        canvas.ontouchstart = (e) => { e.preventDefault(); start(e); };
        canvas.ontouchmove = (e) => { e.preventDefault(); move(e); };
        canvas.ontouchend = stop;

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
